# LocalAIR settings. Everything here can also be set on the Settings page,
# which saves to this file. In Docker it lives at /data/config.toml.

[device]
ip_address = "192.168.1.50"
device_id = "YOUR_DEVICE_ID"
local_key = "YOUR_LOCAL_KEY"
protocol_version = 3.5
poll_interval_seconds = 30

# During the schedule, turn the AC on at turn_on_at and off at turn_off_at
# (room temperatures, °C). When the schedule ends the AC is turned off once.
[climate]
enabled = false
start_time = "10:00"
end_time = "16:00"
turn_on_at = 24.0
turn_off_at = 22.0
aircon_temperature = 16
sensor_timeout_seconds = 120

[server]
host = "0.0.0.0"
port = 8787

[history]
retention_days = 31

# LocalAIR's record of the AC, since IR can't be read back.
[ac_state]
power = "off"
temperature = "24"
