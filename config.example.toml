# Copy to ~/.config/localair/config.toml and replace the placeholder key.
[device]
ip_address = "192.168.1.145"
device_id = "bfc626075b28194ecfhor5"
local_key = "REPLACE_WITH_YOUR_LOCAL_KEY"
protocol_version = 3.5
poll_interval_seconds = 30

[climate]
enabled = false
start_time = "10:00"
end_time = "16:00"
turn_on_at = 24.0
turn_off_at = 22.0
aircon_temperature = 16
sensor_timeout_seconds = 120

[server]
host = "0.0.0.0"
port = 8787

[history]
retention_days = 31

# Legacy NEC remote codes are retained only for observing old remotes.
[ir]
address = 0x08E7

[ir.commands]

# Starting point for assumed PIU14 state tracking.
[ac_state]
power = "off"
temperature = "24"
