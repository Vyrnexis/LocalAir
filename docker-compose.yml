services:
  localair:
    image: ghcr.io/vyrnexis/localair:latest
    # Uncomment to build from this checkout instead of pulling the published image.
    # build: .
    container_name: localair
    restart: unless-stopped
    network_mode: host
    environment:
      LOCALAIR_DATA: /data
      LOCALAIR_PORT: 8787
      TZ: Etc/UTC
    # For standard Linux hosts, you can change the host path to a local directory:
    # - ./data:/data
    volumes:
      - /mnt/user/appdata/localair:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
